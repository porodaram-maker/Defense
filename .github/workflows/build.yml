name: APK 빌드

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 프로젝트 찾기
        run: |
          SG=$(find . -path ./.git -prune -o -name settings.gradle -print | head -n 1)
          if [ -z "$SG" ]; then
            ZIP=$(find . -path ./.git -prune -o -iname "*.zip" -print | head -n 1)
            if [ -z "$ZIP" ]; then echo "zip 파일을 못 찾았어요"; exit 1; fi
            echo "찾은 zip: $ZIP"
            unzip -o "$ZIP" -d unzipped
            SG=$(find unzipped -name settings.gradle | head -n 1)
          fi
          if [ -z "$SG" ]; then echo "settings.gradle을 못 찾았어요"; exit 1; fi
          PROJ=$(dirname "$SG")
          echo "프로젝트 위치: $PROJ"
          echo "PROJ=$PROJ" >> $GITHUB_ENV

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 SDK 준비 (서버에 이미 설치된 것 사용)
        run: |
          echo "SDK 위치: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /de

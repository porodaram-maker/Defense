name: APK 빌드

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 프로젝트 찾기
        run: |
          SG=$(find . -name settings.gradle | head -n 1)
          if [ -z "$SG" ]; then
            ZIP=$(find . -iname "*.zip" | head -n 1)
            echo "찾은 zip: $ZIP"
            unzip -o "$ZIP" -d unzipped
            SG=$(find unzipped -name settings.gradle | head -n 1)
          fi
          PROJ=$(dirname "$SG")
          echo "프로젝트 위치: $PROJ"
          echo "PROJ=$PROJ" >> $GITHUB_ENV

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK 빌드
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dotori-defense-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
